<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Modern Animated Digital Clock</title>
    </head>
    <body>
        
        <article class="background">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </article>
        <main class="clock-container">
            <section class="clock-card">
                <div class="clock-header">
                    <span class="live-dot"></span><span>Live Time</span>
                </div>
                <article class="clock">
                    <div class="time">
                        <span id="hour">00</span>
                        <span class="colon">:</span>
                        <span id="minute">00</span>
                        <span class="colon">:</span>
                        <span id="second">00</span>
                    </div>
                    <div class="ampm" id="ampm">PM</div>
                </article>
                <div class="date-container">
                    <div class="day" id="day">Monday</div>
                    <div class="date" id="date">January 1, 2026</div>
                </div>
                <div class="clock-footer">
                    <span>Winstone's Real Time Digital Clock</span>
                </div>
                </div>
            </section>
        </main>


        <script src="./script.js"></script>
    </body>
</html>
